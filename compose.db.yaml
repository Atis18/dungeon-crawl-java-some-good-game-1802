services:
  db:
    image: postgres:16-alpine
    container_name: dungeon-postgres
    environment:
      POSTGRES_DB: dungeon
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: